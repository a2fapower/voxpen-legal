<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 VoxPen</title>
  <meta name="description" content="登录 VoxPen — 用嘴写,用心想。">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .brand-wordmark { font-family: Georgia, "Times New Roman", Cambria, serif; }
    .bg-frosted {
      background: linear-gradient(135deg, #DCE9FF 0%, #EFD9F7 28%, #FFE0E6 58%, #FFE8D0 100%);
    }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-slow { animation: spin-slow 1.2s linear infinite; }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse-soft { animation: pulse-soft 1.8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-frosted min-h-screen flex flex-col items-center justify-center px-4 py-12">

  <main class="w-full max-w-[420px]">

    <!-- ============== state: card (主动登录卡片, 默认无 hash token) ============== -->
    <section id="state-card" class="hidden bg-white rounded-3xl shadow-xl p-10 text-center">
      <!-- Brand -->
      <div class="flex items-center justify-center gap-2 mb-6 text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8" aria-hidden="true">
          <polyline points="3,4.5 10,19.5 12.5,14" />
          <polyline points="12.5,14 17,4.5" opacity="0.5" />
          <circle cx="20.5" cy="5" r="2" fill="currentColor" stroke="none" />
        </svg>
        <span class="brand-wordmark text-3xl font-bold tracking-tight">VoxPen</span>
      </div>

      <h1 class="text-xl font-semibold text-gray-900 mb-1">登录 VoxPen</h1>
      <p class="text-sm text-gray-500 mb-8">用嘴写,用心想</p>

      <div class="space-y-3">
        <!-- Email (primary, 黑底) -->
        <button id="btn-email" type="button"
          class="w-full bg-black text-white px-5 py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition flex items-center justify-center gap-2.5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <polyline points="3,7 12,13 21,7"/>
          </svg>
          <span>使用邮箱登录</span>
        </button>

        <!-- Phone (disabled, 即将开放) -->
        <button id="btn-phone" type="button" disabled
          class="w-full bg-gray-50 text-gray-400 border border-gray-200 px-5 py-3.5 rounded-xl font-semibold cursor-not-allowed flex items-center justify-center gap-2.5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6" y="2" width="12" height="20" rx="2"/>
            <line x1="11" y1="18" x2="13" y2="18"/>
          </svg>
          <span>使用手机号登录 · 即将开放</span>
        </button>

        <!-- Apple (白底描边) -->
        <button id="btn-apple" type="button"
          class="w-full bg-white text-gray-900 border border-gray-300 px-5 py-3.5 rounded-xl font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-2.5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          <span>使用 Apple 登录</span>
        </button>
      </div>

      <p class="text-xs text-gray-400 mt-8 leading-relaxed">
        继续即表示同意
        <a href="/terms.html" class="underline hover:text-gray-700">服务条款</a>
        与
        <a href="/privacy.html" class="underline hover:text-gray-700">隐私政策</a>
      </p>
    </section>

    <!-- ============== state: email-input (邮箱二步 - 输入邮箱) ============== -->
    <section id="state-email-input" class="hidden bg-white rounded-3xl shadow-xl p-10">
      <button id="btn-back-1" type="button" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 mb-6">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
        <span>返回</span>
      </button>

      <h2 class="text-xl font-semibold text-gray-900 mb-2 text-center">用邮箱登录</h2>
      <p class="text-sm text-gray-500 mb-8 text-center">我们会发送一封登录邮件到你的邮箱</p>

      <form id="form-email" class="space-y-4">
        <label class="block">
          <span class="sr-only">邮箱地址</span>
          <input id="input-email" type="email" required autocomplete="email" placeholder="邮箱地址"
            class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 focus:bg-white transition">
        </label>
        <button id="btn-email-submit" type="submit"
          class="w-full bg-black text-white px-5 py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition disabled:bg-gray-300 disabled:cursor-not-allowed">
          发送登录链接
        </button>
      </form>

      <p id="email-error" class="hidden mt-4 text-sm text-rose-600 text-center"></p>
    </section>

    <!-- ============== state: email-sent (邮件已发送提示) ============== -->
    <section id="state-email-sent" class="hidden bg-white rounded-3xl shadow-xl p-10 text-center">
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-700" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <polyline points="3,7 12,13 21,7"/>
          </svg>
        </div>
      </div>

      <h2 class="text-xl font-semibold text-gray-900 mb-2">请查收邮件</h2>
      <p class="text-sm text-gray-500 mb-1">我们已发送登录链接到</p>
      <p id="email-sent-addr" class="text-sm font-medium text-gray-900 mb-6">user@example.com</p>
      <p class="text-sm text-gray-500 leading-relaxed mb-8">点击邮件中的链接完成登录。<br>邮件可能在垃圾箱,请留意。</p>

      <div class="flex flex-col gap-3 text-sm">
        <button id="btn-resend" type="button" class="text-gray-700 underline-offset-4 hover:underline">重新发送</button>
        <button id="btn-back-2" type="button" class="text-gray-500 hover:text-gray-900">换个邮箱</button>
      </div>
    </section>

    <!-- ============== state: opening (URL 含 token, 正在跳 deep link) ============== -->
    <section id="state-opening" class="hidden bg-white rounded-3xl shadow-xl p-10 text-center">
      <div class="flex items-center justify-center gap-2 mb-8 text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7" aria-hidden="true">
          <polyline points="3,4.5 10,19.5 12.5,14" />
          <polyline points="12.5,14 17,4.5" opacity="0.5" />
          <circle cx="20.5" cy="5" r="2" fill="currentColor" stroke="none" />
        </svg>
        <span class="brand-wordmark text-2xl font-bold tracking-tight">VoxPen</span>
      </div>

      <div class="flex justify-center mb-6">
        <svg class="spin-slow text-gray-400" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
      </div>
      <p class="text-base text-gray-600 pulse-soft">正在打开 VoxPen 应用…</p>
    </section>

    <!-- ============== state: manual (3s 后 deep link 没成功, 手动 fallback) ============== -->
    <section id="state-manual" class="hidden bg-white rounded-3xl shadow-xl p-10 text-center">
      <div class="flex items-center justify-center gap-2 mb-8 text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7" aria-hidden="true">
          <polyline points="3,4.5 10,19.5 12.5,14" />
          <polyline points="12.5,14 17,4.5" opacity="0.5" />
          <circle cx="20.5" cy="5" r="2" fill="currentColor" stroke="none" />
        </svg>
        <span class="brand-wordmark text-2xl font-bold tracking-tight">VoxPen</span>
      </div>

      <p class="text-base text-gray-700 mb-6">VoxPen 没有自动打开?</p>
      <button id="btn-manual-open" type="button"
        class="w-full bg-black text-white px-5 py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition mb-6">
        手动打开 VoxPen
      </button>

      <div class="pt-6 border-t border-gray-200">
        <p class="text-sm text-gray-500 mb-4">还没安装 VoxPen?</p>
        <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 justify-center text-sm">
          <a href="https://testflight.apple.com/join/y9fRRyve" class="text-gray-700 hover:text-black underline-offset-2 hover:underline">iOS · TestFlight</a>
          <span class="hidden sm:inline text-gray-300">·</span>
          <a href="https://voxpen.myorgn.cn/VoxPen-0.1.0.dmg" class="text-gray-700 hover:text-black underline-offset-2 hover:underline">macOS · v0.1.0</a>
          <span class="hidden sm:inline text-gray-300">·</span>
          <span class="text-gray-400">Windows · 即将开放</span>
        </div>
      </div>
    </section>

    <!-- ============== state: oauth-error (OAuth 跳转失败 / Supabase 报错) ============== -->
    <section id="state-error" class="hidden bg-white rounded-3xl shadow-xl p-10 text-center">
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 rounded-full bg-rose-50 flex items-center justify-center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-600" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
      </div>
      <h2 class="text-xl font-semibold text-gray-900 mb-2">登录失败</h2>
      <p id="error-msg" class="text-sm text-gray-600 mb-8 leading-relaxed">未知错误,请重试。</p>
      <button id="btn-error-retry" type="button"
        class="w-full bg-black text-white px-5 py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition">
        返回重试
      </button>
    </section>

  </main>

  <footer class="mt-12 text-center text-xs text-gray-500">
    <p>© 2026 VoxPen</p>
  </footer>

  <script>
    (function () {
      // ----------------------------------------------------------
      // Config (跟 voxpen-win/src/main/supabase/config.ts 对齐)
      // ----------------------------------------------------------
      var SUPABASE_URL = 'https://szqbcexwwsifhasbjhzc.supabase.co'
      var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mj8ep2q88QGykpUOkHOwow_jkljpHcq'
      var DEEP_LINK = 'voxpen://auth-callback'
      var DEEP_LINK_TIMEOUT_MS = 3000

      // ----------------------------------------------------------
      // Supabase client
      // ----------------------------------------------------------
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { detectSessionInUrl: false } // 我们自己处理 hash, 不让 SDK 自动 setSession
      })

      // ----------------------------------------------------------
      // State machine
      // ----------------------------------------------------------
      var STATES = ['state-card', 'state-email-input', 'state-email-sent', 'state-opening', 'state-manual', 'state-error']
      function show(id) {
        STATES.forEach(function (x) {
          var el = document.getElementById(x)
          if (!el) return
          if (x === id) el.classList.remove('hidden')
          else el.classList.add('hidden')
        })
      }

      // ----------------------------------------------------------
      // Init: 检测 URL hash 是否含 access_token
      // ----------------------------------------------------------
      var hash = window.location.hash || ''
      var hasToken = hash.indexOf('access_token=') !== -1

      if (hasToken) {
        // 邮件回调 / OAuth 回调 — 走中间页 deep link
        startDeepLinkFlow(hash)
      } else {
        // 主动登录入口
        show('state-card')
      }

      // ----------------------------------------------------------
      // Deep link flow (复用之前三态: opening → manual fallback)
      // ----------------------------------------------------------
      function startDeepLinkFlow(hashWithToken) {
        show('state-opening')
        var deepLinkUrl = DEEP_LINK + hashWithToken
        try { console.log('[voxpen.cn/login] redirecting to voxpen://auth-callback#<token>') } catch (e) {}
        window.location.href = deepLinkUrl
        setTimeout(function () {
          show('state-manual')
          var btn = document.getElementById('btn-manual-open')
          if (btn) {
            btn.addEventListener('click', function () {
              window.location.href = deepLinkUrl
            })
          }
        }, DEEP_LINK_TIMEOUT_MS)
      }

      // ----------------------------------------------------------
      // Email button → state-email-input
      // ----------------------------------------------------------
      document.getElementById('btn-email').addEventListener('click', function () {
        show('state-email-input')
        setTimeout(function () {
          var input = document.getElementById('input-email')
          if (input) input.focus()
        }, 100)
      })

      // ----------------------------------------------------------
      // Apple button → Supabase OAuth signIn
      // ----------------------------------------------------------
      document.getElementById('btn-apple').addEventListener('click', async function () {
        try {
          var redirectTo = window.location.origin + window.location.pathname
          var result = await client.auth.signInWithOAuth({
            provider: 'apple',
            options: { redirectTo: redirectTo }
          })
          if (result.error) throw result.error
          // Supabase 已发起 OAuth 跳转, 浏览器会跳到 Apple
        } catch (err) {
          showError(err && err.message ? err.message : 'Apple 登录启动失败,请重试。')
        }
      })

      // ----------------------------------------------------------
      // Phone button - disabled (即将开放)
      // ----------------------------------------------------------
      // (button is `disabled` attribute on element, no JS needed)

      // ----------------------------------------------------------
      // Back buttons → state-card
      // ----------------------------------------------------------
      document.getElementById('btn-back-1').addEventListener('click', function () {
        clearEmailError()
        show('state-card')
      })
      document.getElementById('btn-back-2').addEventListener('click', function () {
        clearEmailError()
        show('state-card')
      })

      // ----------------------------------------------------------
      // Email form submit → Supabase signInWithOtp
      // ----------------------------------------------------------
      var lastEmail = ''
      document.getElementById('form-email').addEventListener('submit', async function (e) {
        e.preventDefault()
        var emailInput = document.getElementById('input-email')
        var submitBtn = document.getElementById('btn-email-submit')
        var email = (emailInput.value || '').trim()
        if (!email || email.indexOf('@') === -1) {
          showEmailError('请输入有效的邮箱地址')
          return
        }

        clearEmailError()
        submitBtn.disabled = true
        submitBtn.textContent = '发送中…'

        try {
          var redirectTo = window.location.origin + window.location.pathname
          var result = await client.auth.signInWithOtp({
            email: email,
            options: {
              emailRedirectTo: redirectTo,
              shouldCreateUser: true,
            }
          })
          if (result.error) throw result.error

          lastEmail = email
          document.getElementById('email-sent-addr').textContent = email
          show('state-email-sent')
        } catch (err) {
          showEmailError(err && err.message ? err.message : '发送失败,请稍后重试。')
        } finally {
          submitBtn.disabled = false
          submitBtn.textContent = '发送登录链接'
        }
      })

      // ----------------------------------------------------------
      // Resend
      // ----------------------------------------------------------
      document.getElementById('btn-resend').addEventListener('click', async function () {
        if (!lastEmail) return
        var btn = this
        btn.textContent = '发送中…'
        btn.disabled = true
        try {
          var redirectTo = window.location.origin + window.location.pathname
          var result = await client.auth.signInWithOtp({
            email: lastEmail,
            options: { emailRedirectTo: redirectTo, shouldCreateUser: true }
          })
          if (result.error) throw result.error
          btn.textContent = '已重新发送 ✓'
          setTimeout(function () { btn.textContent = '重新发送'; btn.disabled = false }, 3000)
        } catch (err) {
          btn.textContent = '重新发送'
          btn.disabled = false
          showEmailError(err && err.message ? err.message : '发送失败,请稍后重试。')
          show('state-email-input')
        }
      })

      // ----------------------------------------------------------
      // Error retry
      // ----------------------------------------------------------
      document.getElementById('btn-error-retry').addEventListener('click', function () {
        show('state-card')
      })

      // ----------------------------------------------------------
      // Helpers
      // ----------------------------------------------------------
      function showEmailError(msg) {
        var el = document.getElementById('email-error')
        el.textContent = msg
        el.classList.remove('hidden')
      }
      function clearEmailError() {
        var el = document.getElementById('email-error')
        if (el) { el.textContent = ''; el.classList.add('hidden') }
      }
      function showError(msg) {
        document.getElementById('error-msg').textContent = msg
        show('state-error')
      }
    })()
  </script>

</body>
</html>
